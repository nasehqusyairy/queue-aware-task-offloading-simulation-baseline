<!doctype html><meta charset="utf-8"><title>PureEdgeSim baseline dashboard</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd;padding:.5rem;text-align:left}pre{background:#f4f6f8;padding:1rem}</style><h1>Technical baseline results</h1><p>Values are read from successful-run metrics.json generated from PureEdgeSim CSV. Missing values are shown as N/A.</p><div id="table"></div><canvas id="chart" width="900" height="300"></canvas><h2>Run data</h2><pre id="json"></pre><script>fetch('processed/summary.json').then(r=>r.json()).then(rows=>{json.textContent=JSON.stringify(rows,null,2);table.innerHTML='<table><tr><th>Run</th><th>Method</th><th>UE</th><th>Generated</th><th>Successful</th><th>Success rate</th><th>Energy (Wh)</th></tr>'+rows.map(x=>`<tr><td>${x.run_id}</td><td>${x.method}</td><td>${x.devices}</td><td>${x.generated_tasks??'N/A'}</td><td>${x.successful_tasks??'N/A'}</td><td>${x.task_success_rate==null?'N/A':(100*x.task_success_rate).toFixed(2)+'%'}</td><td>${x.energy_consumption??'N/A'}</td></tr>`).join('')+'</table>';let c=chart.getContext('2d');rows.forEach((x,i)=>{let y=35+i*45;c.fillText(x.method+' ('+x.devices+')',8,y+15);if(x.task_success_rate==null)c.fillText('N/A',220,y+15);else {c.fillStyle='#198754';c.fillRect(220,y,Math.max(1,600*x.task_success_rate),22);c.fillStyle='#111';c.fillText((100*x.task_success_rate).toFixed(2)+'%',830,y+15)}})});</script>
